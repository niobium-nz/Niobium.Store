name: Azure Deployment

on:
  push:
    branches: ['**', '!main']
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'test-deployment' || 'production-deployment' }}
  cancel-in-progress: false
  queue: max

env:
  buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}'
  SourceRevisionId: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.merge_commit_sha }}

jobs:
  build:
    name: Build and local tests
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and build
        run: |
          dotnet restore Niobium.Store.slnx --nologo
          dotnet build Niobium.Store.slnx --configuration Release --no-restore --nologo
      - name: Application tests
        run: dotnet test --project src/Niobium.Store.Core.Tests/Niobium.Store.Core.Tests.csproj --configuration Release --no-build --no-restore --report-trx --results-directory artifacts/unit
      - name: Delivery policy tests
        run: |
          python -m pip install -r scripts/requirements-test.txt
          python -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/*.test.cjs src/Niobium.Store.IntegrationTests/fixture-config.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-evidence-${{ github.sha }}
          path: artifacts/unit/
          if-no-files-found: error

  test:
    name: Deploy test and run integration
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: 'test'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test fixture configuration
        env:
          TEST_ENVIRONMENT: test
          TEST_NOTIFICATION_RECIPIENT: ${{ secrets.TEST_NOTIFICATION_RECIPIENT }}
        run: node src/Niobium.Store.IntegrationTests/fixture-config.js

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_LOCATION: 'australiaeast'
          AZURE_RESOURCE_GROUP: 'rg-niobium-store-test'
          AZURE_ENV_NAME: 'test'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Store.Server.Test'
          APPSETTING_SERVICE_VERSION: '${{ env.buildVersion }}-prerelease'
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: 'true'
          APPSETTING_STOREOPTIONS__INVOICINGTENANT: '95b52e52-dc79-4ac0-a53f-1acb10238888'
          APPSETTING_INVOICEQUEUEOPTIONS__FULLYQUALIFIEDNAMESPACE: 'niobiuminvoicing-sb-test.servicebus.windows.net'
          APPSETTING_NOTIFICATIONQUEUEOPTIONS__FULLYQUALIFIEDNAMESPACE: 'niobiumnotify-sb-test.servicebus.windows.net'
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETAPIKEY: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETAPIKEY }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETHASHKEY: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETHASHKEY }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__HASHES__2AAD53C9_9849_43A9_BCD7_50425B3249D5: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__HASHES__2AAD53C9_9849_43A9_BCD7_50425B3249D5 }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__HASHES__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__HASHES__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETS__2AAD53C9_9849_43A9_BCD7_50425B3249D5: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETS__2AAD53C9_9849_43A9_BCD7_50425B3249D5 }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETS__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETS__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt

      - name: Verify deployed test commit
        env:
          READONLY_BASE_URL: https://${{ secrets.CUSTOM_DOMAIN_NAME }}
          READONLY_EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/read-only-deployment.py --report artifacts/test-deployment.json
      - name: Integration tests
        id: integration
        working-directory: src/Niobium.Store.IntegrationTests
        env:
          API_URL: 'https://${{ secrets.CUSTOM_DOMAIN_NAME }}'
          TEST_ENVIRONMENT: test
          TEST_NOTIFICATION_RECIPIENT: ${{ secrets.TEST_NOTIFICATION_RECIPIENT }}
        run: |
          npm ci
          npm test
      - name: Collect test failure diagnostics
        if: failure() && steps.integration.outcome == 'failure'
        continue-on-error: true
        run: python scripts/collect-test-diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('artifacts/test-deployment.json') != ''
        with:
          name: test-deployment-evidence-${{ github.sha }}
          path: |
            artifacts/test-deployment.json
            artifacts/test-diagnostics.json
          if-no-files-found: error

  prod:
    name: Deploy production and run read-only verification
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: 'prod'

    steps:
      - name: Verify current merged production commit
        id: merge
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (context.eventName !== 'pull_request_target' || context.payload.action !== 'closed' ||
                pr?.merged !== true || pr.base?.ref !== 'main' ||
                pr.base?.repo?.full_name?.toLowerCase() !== repository ||
                !/^[0-9a-f]{40}$/.test(pr.merge_commit_sha ?? '')) {
              core.setFailed('A merged PR to this repository main is required.');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            const current = branch.commit.sha === pr.merge_commit_sha;
            core.setOutput('current', String(current));
            if (!current) {
              core.notice('Superseded merge: production deployment skipped.');
              await core.summary.addRaw('This merge has been superseded by a newer main commit. Follow that commit’s production run.').write();
            }

      - name: Checkout
        if: steps.merge.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        if: steps.merge.outputs.current == 'true'
        with:
          dotnet-version: '10.x.x'

      - name: Install azd
        if: steps.merge.outputs.current == 'true'
        uses: Azure/setup-azd@v2

      - name: Azure login
        if: steps.merge.outputs.current == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd login
        if: steps.merge.outputs.current == 'true'
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Publish
        if: steps.merge.outputs.current == 'true'
        env:
          AZURE_LOCATION: 'australiaeast'
          AZURE_RESOURCE_GROUP: 'rg-niobium-store-prod'
          AZURE_ENV_NAME: 'prod'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Store.Server.Prod'
          APPSETTING_SERVICE_VERSION: ${{ env.buildVersion }}
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: 'false'
          APPSETTING_STOREOPTIONS__INVOICINGTENANT: '95b52e52-dc79-4ac0-a53f-1acb10238888'
          APPSETTING_INVOICEQUEUEOPTIONS__FULLYQUALIFIEDNAMESPACE: 'niobiuminvoicing-sb-prod.servicebus.windows.net'
          APPSETTING_NOTIFICATIONQUEUEOPTIONS__FULLYQUALIFIEDNAMESPACE: 'niobiumnotify-sb-prod.servicebus.windows.net'
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETAPIKEY: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETAPIKEY }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETHASHKEY: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETHASHKEY }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__TAPSS_CARE: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__TAPSS_CARE }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__NIOBIUM_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__NIOBIUM_CO_NZ }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__ZAPS_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__ZAPS_CO_NZ }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__HASHES__2AAD53C9_9849_43A9_BCD7_50425B3249D5: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__HASHES__2AAD53C9_9849_43A9_BCD7_50425B3249D5 }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__HASHES__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__HASHES__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETS__2AAD53C9_9849_43A9_BCD7_50425B3249D5: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETS__2AAD53C9_9849_43A9_BCD7_50425B3249D5 }}
          APPSETTING_KV_PAYMENTSERVICEOPTIONS__SECRETS__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD: ${{ secrets.APPSETTING_PAYMENTSERVICEOPTIONS__SECRETS__DE8B3E50_ABF6_4CDD_9269_F2472A1020AD }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt

      - name: Deploy assets
        if: steps.merge.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "./assets" --project-name="assets-store-niobium-co-nz" --branch=main
      - name: Run production read-only verification
        if: steps.merge.outputs.current == 'true'
        env:
          READONLY_BASE_URL: https://${{ secrets.CUSTOM_DOMAIN_NAME }}
          READONLY_EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: python scripts/read-only-deployment.py --report artifacts/production-read-only.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('artifacts/production-read-only.json') != ''
        with:
          name: production-read-only-evidence-${{ github.event.pull_request.merge_commit_sha }}
          path: artifacts/production-read-only.json
          if-no-files-found: error
